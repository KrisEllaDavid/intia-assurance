services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET:   ${JWT_SECRET}
      PORT:         4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Apollo Server v4 requires apollo-require-preflight header for POST requests
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"query\":\"{__typename}\"}' --header='Content-Type: application/json' --header='apollo-require-preflight: 1' http://localhost:4000/ | grep -q '__typename'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
