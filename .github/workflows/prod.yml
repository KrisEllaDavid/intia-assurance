name: Prod — Promote & Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "deploy-prod" pour confirmer le déploiement en production'
        required: true
        type: string

# Donne les droits d'écriture au GITHUB_TOKEN intégré (pas de PAT nécessaire)
permissions:
  contents: write

jobs:
# ══════════════════════════════════════════════════════════════════════════════
# 0. GUARD — vérification de la confirmation
# ══════════════════════════════════════════════════════════════════════════════
  guard:
    name: Confirm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "Confirmation invalide. Tapez exactement : deploy-prod"
            exit 1
          fi
          echo "Confirmation OK — déploiement production lancé."

# ══════════════════════════════════════════════════════════════════════════════
# 1. PROMOTE — dev → prod → main
# ══════════════════════════════════════════════════════════════════════════════
  promote:
    name: Merge dev → prod → main
    runs-on: ubuntu-latest
    needs: [guard]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Utilise le GITHUB_TOKEN intégré (automatique, aucun secret à créer)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev → prod
        run: |
          git checkout prod
          git merge origin/dev --no-ff -m "chore(release): promote dev to prod [skip ci]"
          git push origin prod

      - name: Merge prod → main
        run: |
          git checkout main
          git merge origin/prod --no-ff -m "chore(release): release to production [skip ci]"
          git push origin main

# ══════════════════════════════════════════════════════════════════════════════
# 2. DÉPLOIEMENT PROD
# ══════════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: Deploy → Prod Server
    runs-on: ubuntu-latest
    needs: [promote]

    steps:
      - name: SSH — git pull & docker compose up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH_PROD }}
            git pull origin main
            docker compose up -d --build
            docker image prune -f

      - name: Health check — Prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            sleep 20
            curl -sf -X POST http://localhost:3098/ \
              -H "Content-Type: application/json" \
              -d '{"query":"{__typename}"}' | grep -q '__typename' \
              && echo "✓ Backend prod (3098) OK" \
              || { echo "✗ Backend prod KO"; exit 1; }

            curl -sf http://localhost:3097/ | grep -qi 'html' \
              && echo "✓ Frontend prod (3097) OK" \
              || { echo "✗ Frontend prod KO"; exit 1; }
